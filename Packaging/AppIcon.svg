<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FB7FB"/>
      <stop offset="1" stop-color="#1C72E8"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8CF2"/>
      <stop offset="1" stop-color="#1457D4"/>
    </linearGradient>
    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0A356E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="62" y="62" width="900" height="900" rx="206" fill="url(#bg)"/>

  <!-- clipboard clip (behind/above the board top) -->
  <rect x="437" y="226" width="150" height="96" rx="30" fill="#D7E8FC"/>
  <rect x="470" y="206" width="84" height="58" rx="24" fill="#BBD8F8"/>

  <!-- clipboard board -->
  <rect x="300" y="286" width="424" height="544" rx="50" fill="#FFFFFF" filter="url(#boardShadow)"/>

  <!-- padlock body -->
  <rect x="410" y="520" width="204" height="176" rx="36" fill="url(#lock)"/>
  <!-- padlock shackle -->
  <path d="M452 520 v-46 a60 60 0 0 1 120 0 v46" fill="none" stroke="url(#lock)" stroke-width="36" stroke-linecap="round"/>
  <!-- keyhole -->
  <circle cx="512" cy="596" r="27" fill="#FFFFFF"/>
  <rect x="499" y="600" width="26" height="58" rx="13" fill="#FFFFFF"/>
</svg>
